<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verifier</title>

    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div style="background-color: gray;">
        <h1>Age Verification Website</h1>
        <h3>Please enter your age below to determine the ticket price.</h3>
    </div>
    <div style="text-align: center;">
        <input id="age" placeholder="Age">
        <label for="age" style="color:white;">years old</label>
        <button id="submit" style="color: white;" onclick="changeResult(determinePricing(document.getElementById('age').value))">Submit</button>
        <p id="result"></p>
    </div>
</body>
</html>
